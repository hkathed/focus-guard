<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Focus Guard</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <div class="settings">
        <label for="site-list">Sites to watch</label>
        <input type="text" id="site-list" placeholder="reddit.com, youtube.com" />

        <label for="time-limit">Time limit (minutes)</label>
        <input type="number" id="time-limit" min="1" value="5" />

        <button id="save-btn">Save Settings</button>
    </div>
    <script src="popup.js"></script>
</body>

</html>
